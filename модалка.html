<!-- МОДАЛЬНОЕ ОКНО -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-header">
            <h3>Добро пожаловать</h3>
            <button class="close-modal" id="closeModalBtn">✕</button>
        </div>
        
        <div class="modal-tabs">
            <button class="tab-btn active" data-tab="login">Вход</button>
            <button class="tab-btn" data-tab="register">Регистрация</button>
        </div>
        
        <!-- Форма входа -->
        <div id="loginForm" class="modal-form">
            <div class="form-group">
                <label>Email или логин</label>
                <input type="text" id="loginEmail" placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
            </div>
            <button class="submit-btn" id="submitLoginBtn">Войти</button>
            <div class="form-footer">
                <a href="#" id="switchToRegister" style="color:#b07ad9;">Зарегистрироваться</a>
            </div>
        </div>
        
        <!-- Форма регистрации -->
        <div id="registerForm" class="modal-form hidden-form">
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" id="regUsername" placeholder="Как вас называть?">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="regPassword" placeholder="минимум 6 символов">
            </div>
            <button class="submit-btn" id="submitRegisterBtn">Создать аккаунт</button>
            <div class="form-footer">
                <a href="#" id="switchToLogin" style="color:#b07ad9;">Войти</a>
            </div>
        </div>
    </div>
</div>
